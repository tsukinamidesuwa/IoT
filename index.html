<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Realtime Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase App & Database (v9+ Compatibility SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 sm:p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">IoT Environmental Dashboard</h1>
                <p class="text-xs text-slate-400 mt-1">Realtime Monitoring via Firebase RTDB</p>
            </div>
            <div class="mt-4 sm:mt-0 flex items-center space-x-2">
                <span id="status-dot" class="w-3 h-3 bg-red-500 rounded-full inline-block animate-pulse"></span>
                <span id="status-text" class="text-sm font-medium text-slate-300">Disconnected</span>
            </div>
        </header>

        <!-- Realtime Value Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Temperature Card -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Temperature</span>
                    <span class="text-xs px-2.5 py-1 bg-rose-500/10 text-rose-400 rounded-full font-semibold">°C</span>
                </div>
                <div class="flex items-baseline space-x-2">
                    <span id="temp-val" class="text-5xl font-extrabold text-slate-100">--</span>
                    <span class="text-slate-400">°C</span>
                </div>
            </div>

            <!-- Humidity Card -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Humidity</span>
                    <span class="text-xs px-2.5 py-1 bg-sky-500/10 text-sky-400 rounded-full font-semibold">% RH</span>
                </div>
                <div class="flex items-baseline space-x-2">
                    <span id="humid-val" class="text-5xl font-extrabold text-slate-100">--</span>
                    <span class="text-slate-400">%</span>
                </div>
            </div>

        </div>

        <!-- Historical Data Chart -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
            <h2 class="text-lg font-semibold text-slate-200 mb-4">Historical Data Trend</h2>
            <div class="relative h-72 sm:h-80 w-full">
                <canvas id="iotChart"></canvas>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-xs text-slate-500 pt-2">
            Last Updated: <span id="last-updated">Never</span>
        </footer>

    </div>

    <script>
        // -------------------------------------------------------------
        // 1. ตั้งค่า Firebase Configuration (แก้ไขข้อมูลตาม Project คุณ)
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // -------------------------------------------------------------
        // 2. Setup Chart.js (กราฟเส้นแสดงข้อมูลย้อนหลัง)
        // -------------------------------------------------------------
        const ctx = document.getElementById('iotChart').getContext('2d');
        const iotChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // เก็บเวลา Timestamp
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: '#f43f5e', // Red/Rose
                        backgroundColor: 'rgba(244, 63, 94, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 3
                    },
                    {
                        label: 'Humidity (%)',
                        data: [],
                        borderColor: '#0ea5e9', // Blue/Sky
                        backgroundColor: 'rgba(14, 165, 233, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    y: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#cbd5e1' }
                    }
                }
            }
        });

        // -------------------------------------------------------------
        // 3. อ่านข้อมูล Realtime จาก node: /latest
        // -------------------------------------------------------------
        database.ref('latest').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // อัปเดตค่าบนการ์ด
                document.getElementById('temp-val').innerText = data.temperature !== undefined ? data.temperature.toFixed(1) : '--';
                document.getElementById('humid-val').innerText = data.humidity !== undefined ? data.humidity.toFixed(1) : '--';
                
                // อัปเดตเวลาล่าสุด
                const dateObj = data.timestamp ? new Date(data.timestamp * 1000) : new Date();
                document.getElementById('last-updated').innerText = dateObj.toLocaleTimeString('th-TH');

                // อัปเดตสถานะการเชื่อมต่อ
                document.getElementById('status-dot').className = "w-3 h-3 bg-emerald-500 rounded-full inline-block animate-ping";
                document.getElementById('status-text').innerText = "Connected & Receiving";
                document.getElementById('status-text').className = "text-sm font-medium text-emerald-400";
            }
        });

        // -------------------------------------------------------------
        // 4. อ่านข้อมูลย้อนหลัง จาก node: /history (จำกัด 20 รายการล่าสุด)
        // -------------------------------------------------------------
        database.ref('history').limitToLast(20).on('value', (snapshot) => {
            const historyData = snapshot.val();
            if (historyData) {
                const times = [];
                const temps = [];
                const humids = [];

                Object.keys(historyData).forEach(key => {
                    const item = historyData[key];
                    
                    // แปลง timestamp เป็นรูปแบบ HH:mm:ss
                    const timeString = item.timestamp 
                        ? new Date(item.timestamp * 1000).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                        : '';
                    
                    times.push(timeString);
                    temps.push(item.temperature);
                    humids.push(item.humidity);
                });

                // อัปเดตข้อมูลเข้า Chart.js
                iotChart.data.labels = times;
                iotChart.data.datasets[0].data = temps;
                iotChart.data.datasets[1].data = humids;
                iotChart.update();
            }
        });
    </script>
</body>
</html>
