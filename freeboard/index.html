<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Realtime Freeboard Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">IoT Sensor Freeboard (iot-117)</h1>
                <p class="text-xs text-slate-400 mt-1">Realtime Monitoring (6 Metrics)</p>
            </div>
            <div class="mt-4 sm:mt-0 flex items-center space-x-2">
                <span id="status-dot" class="w-3 h-3 bg-red-500 rounded-full inline-block animate-pulse"></span>
                <span id="status-text" class="text-sm font-medium text-slate-300">Disconnected</span>
            </div>
        </header>

        <!-- 6 Data Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 1. Temp -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Temperature</span>
                    <span class="text-xs px-2 py-0.5 bg-rose-500/10 text-rose-400 rounded-full font-semibold">°C</span>
                </div>
                <div class="text-4xl font-extrabold text-slate-100" id="temp-val">--</div>
            </div>

            <!-- 2. Humid -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Humidity</span>
                    <span class="text-xs px-2 py-0.5 bg-sky-500/10 text-sky-400 rounded-full font-semibold">% RH</span>
                </div>
                <div class="text-4xl font-extrabold text-slate-100" id="humid-val">--</div>
            </div>

            <!-- 3. Light -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Light</span>
                    <span class="text-xs px-2 py-0.5 bg-amber-500/10 text-amber-400 rounded-full font-semibold">lx</span>
                </div>
                <div class="text-4xl font-extrabold text-slate-100" id="light-val">--</div>
            </div>

            <!-- 4. Pressure -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Pressure</span>
                    <span class="text-xs px-2 py-0.5 bg-indigo-500/10 text-indigo-400 rounded-full font-semibold">hPa</span>
                </div>
                <div class="text-4xl font-extrabold text-slate-100" id="press-val">--</div>
            </div>

            <!-- 5. Gas Level -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Gas Level</span>
                    <span class="text-xs px-2 py-0.5 bg-emerald-500/10 text-emerald-400 rounded-full font-semibold">ppm</span>
                </div>
                <div class="text-4xl font-extrabold text-slate-100" id="gas-val">--</div>
            </div>

            <!-- 6. Battery -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-slate-400 text-sm font-medium">Battery</span>
                    <span class="text-xs px-2 py-0.5 bg-purple-500/10 text-purple-400 rounded-full font-semibold">%</span>
                </div>
                <div class="text-4xl font-extrabold text-slate-100" id="bat-val">--</div>
            </div>

        </div>

        <!-- Historical Data Chart -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
            <h2 class="text-lg font-semibold text-slate-200 mb-4">Historical Realtime Trend</h2>
            <div class="relative h-72 sm:h-80 w-full">
                <canvas id="iotChart"></canvas>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-xs text-slate-500 pt-2">
            Last Updated: <span id="last-updated">Never</span>
        </footer>

    </div>

    <script>
        // ⚠️ นำค่า Config จริงจาก Project iot-117-16744 มาวางแทนที่ส่วนนี้
        const firebaseConfig = {
            apiKey: "นำมาจาก Firebase Console ของ iot-117-16744",
            authDomain: "iot-117-16744.firebaseapp.com",
            databaseURL: "https://iot-117-16744-default-rtdb.firebaseio.com",
            projectId: "iot-117-16744",
            storageBucket: "iot-117-16744.firebasestorage.app",
            messagingSenderId: "xxxxxxxxx",
            appId: "xxxxxxxxx"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const DB_NODE = "iot-117"; 

        // Setup Chart.js
        const ctx = document.getElementById('iotChart').getContext('2d');
        const iotChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Temp (°C)', data: [], borderColor: '#f43f5e', tension: 0.3 },
                    { label: 'Humid (%)', data: [], borderColor: '#0ea5e9', tension: 0.3 },
                    { label: 'Light (lx)', data: [], borderColor: '#f59e0b', tension: 0.3 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                },
                plugins: { legend: { labels: { color: '#cbd5e1' } } }
            }
        });

        // 1. อ่านค่า Latest
        database.ref(`${DB_NODE}/latest`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('temp-val').innerText = data.temperature !== undefined ? data.temperature.toFixed(1) : '--';
                document.getElementById('humid-val').innerText = data.humidity !== undefined ? data.humidity.toFixed(1) : '--';
                document.getElementById('light-val').innerText = data.light !== undefined ? data.light.toFixed(1) : '--';
                document.getElementById('press-val').innerText = data.pressure !== undefined ? data.pressure.toFixed(1) : '--';
                document.getElementById('gas-val').innerText = data.gas_level !== undefined ? data.gas_level.toFixed(1) : '--';
                document.getElementById('bat-val').innerText = data.battery !== undefined ? data.battery.toFixed(1) : '--';

                document.getElementById('last-updated').innerText = new Date().toLocaleTimeString('th-TH');
                document.getElementById('status-dot').className = "w-3 h-3 bg-emerald-500 rounded-full inline-block animate-ping";
                document.getElementById('status-text').innerText = "Connected & Receiving";
                document.getElementById('status-text').className = "text-sm font-medium text-emerald-400";
            }
        });

        // 2. อ่านค่า History (20 รายการล่าสุด)

// ดึงข้อมูล Realtime จาก /latest
database.ref('latest').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        // อัปเดตการแสดงผล 6 ค่า
        document.getElementById('temp-val').innerText = data.temperature !== undefined ? data.temperature.toFixed(1) : '--';
        document.getElementById('humid-val').innerText = data.humidity !== undefined ? data.humidity.toFixed(1) : '--';
        document.getElementById('light-val').innerText = data.light !== undefined ? data.light.toFixed(1) : '--';
        
        // 3 ค่าที่เพิ่มเข้ามาใหม่
        document.getElementById('press-val').innerText = data.pressure !== undefined ? data.pressure.toFixed(1) : '--';
        document.getElementById('gas-val').innerText = data.gas_level !== undefined ? data.gas_level.toFixed(1) : '--';
        document.getElementById('bat-val').innerText = data.battery !== undefined ? data.battery.toFixed(1) : '--';

        // แสดงเวลาล่าสุดที่อัปเดต
        if (document.getElementById('last-updated')) {
            document.getElementById('last-updated').innerText = new Date().toLocaleTimeString('th-TH');
        }

        // สถานะการเชื่อมต่อ
        const statusText = document.getElementById('status-text');
        if (statusText) {
            statusText.innerText = "Connected";
            statusText.className = "text-sm font-medium text-emerald-400";
        }
    }
});
    </script>
</body>
</html>
